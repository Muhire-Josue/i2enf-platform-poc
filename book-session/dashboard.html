<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réserver une séance — I2ENF</title>
  <!-- Bootstrap (banners only) first, so the site's own styles take priority -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/app.css">
  <link rel="stylesheet" href="book-session.css">
</head>
<body class="app-page">

  <header class="app-header" id="app-header"></header>

  <main class="container page">
    <a href="../mentorship/dashboard.html" class="back-link"><span aria-hidden="true">←</span> <span data-i18n="book_back">Retour au mentorat</span></a>

    <section class="page-head">
      <div class="page-head-text">
        <span class="kicker" data-i18n="app_nav_mentorship">Mentorat</span>
        <h1 id="book-title"></h1>
        <p id="book-intro"></p>
      </div>
    </section>

    <div id="page-alerts" aria-live="polite"></div>

    <div class="page-grid">
      <div class="page-main">
        <section class="dash-card book-step">
          <h2 class="step-title"><span class="step-num">1</span><span data-i18n="book_step_mentor">Avec qui?</span></h2>
          <div class="mentor-options" id="mentor-options" role="radiogroup"></div>
        </section>

        <section class="dash-card book-step">
          <h2 class="step-title"><span class="step-num">2</span><span data-i18n="book_step_when">Quand?</span></h2>
          <div class="field-group">
            <span class="field-label" data-i18n="book_duration">Durée</span>
            <div class="choice-chips" id="duration-options" role="radiogroup"></div>
          </div>
          <div class="field-group">
            <span class="field-label" data-i18n="book_day">Date</span>
            <div class="day-strip" id="day-options" role="radiogroup"></div>
          </div>
          <div class="field-group">
            <span class="field-label" data-i18n="book_time">Heure</span>
            <div class="slot-grid" id="slot-options" role="radiogroup"></div>
          </div>
        </section>

        <section class="dash-card book-step">
          <h2 class="step-title"><span class="step-num">3</span><span data-i18n="book_step_details">Comment et pourquoi?</span></h2>
          <div class="field-group">
            <span class="field-label" data-i18n="book_format">Format</span>
            <div class="format-options" id="format-options" role="radiogroup"></div>
          </div>
          <div class="form-field">
            <label for="topic" data-i18n="book_topic">Sujet de la séance</label>
            <select id="topic"></select>
          </div>
          <div class="form-field">
            <label for="note" data-i18n="book_note">Message pour votre mentor (facultatif)</label>
            <textarea id="note" rows="3" data-i18n-placeholder="book_note_placeholder" placeholder="Ce que vous aimeriez préparer ou aborder"></textarea>
          </div>
        </section>
      </div>

      <aside class="page-side">
        <section class="dash-card card-navy summary-card" id="summary"></section>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/mock-data.js"></script>
  <script src="../shared/alerts.js"></script>
  <script src="../shared/app.js"></script>
  <script src="book-session.js"></script>
</body>
</html>
