<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dossiers — I2ENF</title>
  <!-- Bootstrap (banners only) first, so the site's own styles take priority -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/app.css">
  <link rel="stylesheet" href="cases.css">
</head>
<body class="app-page">

  <header class="app-header" id="app-header"></header>

  <main class="container page">
    <section class="page-head">
      <div class="page-head-text">
        <span class="kicker" data-i18n="staff_kicker">Espace personnel</span>
        <h1 data-i18n="cases_title">Dossiers des entrepreneurs</h1>
        <p id="cases-intro"></p>
      </div>
    </section>

    <div id="page-alerts" aria-live="polite"></div>

    <section class="cases-stats" id="cases-stats" aria-label="Résumé"></section>

    <section class="dash-card">
      <div class="cases-toolbar">
        <div class="cases-filters" id="cases-filters" role="tablist" aria-label="Suivi"></div>
        <div class="cases-search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="cases-search" data-i18n-placeholder="cases_search" placeholder="Nom ou entreprise" aria-label="Rechercher">
        </div>
      </div>
      <div class="cases-table-head" aria-hidden="true">
        <span data-i18n="cases_col_entrepreneur">Entrepreneur</span>
        <span data-i18n="cases_col_mentor">Mentor</span>
        <span data-i18n="cases_col_progress">Plan de parcours</span>
        <span data-i18n="cases_col_status">Suivi</span>
        <span></span>
      </div>
      <ul class="cases-list" id="cases-list"></ul>
    </section>
  </main>

  <!-- Case file -->
  <dialog class="app-dialog case-dialog" id="case-dialog" aria-labelledby="case-name">
    <form method="dialog" id="case-form" novalidate>
      <button type="submit" value="close" class="case-close" data-i18n-aria-label="cases_close" aria-label="Fermer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="case-body"></div>

      <div class="case-block">
        <h3 data-i18n="cases_notes">Notes de suivi</h3>
        <ul class="case-notes" id="case-notes"></ul>
        <div class="form-field">
          <label for="case-note" class="visually-hidden" data-i18n="cases_note_label">Nouvelle note</label>
          <textarea id="case-note" rows="3" data-i18n-placeholder="cases_note_ph" placeholder="Appel, courriel, rencontre… Visible seulement par l'équipe SOFIFRAN"></textarea>
        </div>
        <p class="case-error" id="case-error" role="alert" hidden></p>
        <p class="case-saved" id="case-saved" role="status" hidden></p>
      </div>

      <div class="case-actions">
        <button type="button" class="btn-outline" id="case-remind" data-i18n="cases_remind">Envoyer un rappel</button>
        <button type="button" class="btn-primary" id="case-add-note" data-i18n="cases_add_note">Ajouter la note</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/mock-data.js"></script>
  <script src="../shared/alerts.js"></script>
  <script src="../shared/app.js"></script>
  <script src="../shared/staff.js"></script>
  <!-- <script src="cases.js"></script> -->
</body>
</html>
