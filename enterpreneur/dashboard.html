<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tableau de bord — I2ENF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="app-page">

  <header class="app-header">
    <div class="container app-header-inner">
      <a href="dashboard.html" class="logo">
        <span class="logo-main">I2ENF</span>
        <span class="logo-sub">SOFIFRAN</span>
      </a>

      <nav class="app-nav" aria-label="Espace entrepreneur">
        <a href="dashboard.html" class="active" aria-current="page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span data-i18n="dash_nav_home">Tableau de bord</span>
        </a>
        <a href="../diagnostic/dashboard.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          <span data-i18n="dash_nav_diagnostic">Mon diagnostic</span>
        </a>
        <a href="../mentorship/dashboard.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
          <span data-i18n="dash_nav_mentorship">Mentorat</span>
        </a>
        <a href="business-file.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
          <span data-i18n="dash_nav_file">Dossier d'entreprise</span>
        </a>
      </nav>

      <div class="app-header-actions">
        <div class="lang-toggle">
          <button data-lang="fr" type="button" class="active">FR</button>
          <button data-lang="en" type="button">EN</button>
        </div>
        <div class="user-chip">
          <span class="user-avatar" id="user-initials" aria-hidden="true"></span>
          <span class="user-name" id="user-name"></span>
        </div>
        <a href="../auth/login.html" class="btn-logout" id="logout-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
          <span data-i18n="dash_logout">Déconnexion</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container dash">
    <section class="dash-welcome">
      <div class="dash-welcome-text">
        <span class="kicker" data-i18n="dash_kicker">Espace entrepreneur</span>
        <h1 id="welcome-title"></h1>
        <p id="welcome-sub"></p>
      </div>
      <a href="mentorship.html" class="btn-primary dash-cta">
        <span data-i18n="dash_book_session">Réserver une séance</span>
      </a>
    </section>

    <section class="dash-stats" id="dash-stats" aria-label="Résumé"></section>

    <div class="dash-grid">
      <div class="dash-main">
        <section class="dash-card">
          <div class="card-head">
            <h2 data-i18n="dash_plan_title">Mon plan de parcours</h2>
            <a href="diagnostic.html" class="card-link" data-i18n="dash_plan_link">Voir mon diagnostic →</a>
          </div>
          <div class="plan-progress">
            <div class="plan-progress-text">
              <span id="plan-progress-label"></span>
              <strong id="plan-progress-pct"></strong>
            </div>
            <div class="progress-track"><div class="progress-fill" id="plan-progress-fill"></div></div>
          </div>
          <ol class="milestones" id="milestones"></ol>
        </section>

        <section class="dash-card">
          <div class="card-head">
            <h2 data-i18n="dash_tasks_title">À faire</h2>
            <span class="card-count" id="tasks-count"></span>
          </div>
          <ul class="tasks" id="tasks"></ul>
        </section>
      </div>

      <aside class="dash-side">
        <section class="dash-card session-card" id="next-session"></section>

        <section class="dash-card">
          <div class="card-head">
            <h2 data-i18n="dash_events_title">Événements de la cohorte</h2>
          </div>
          <ul class="events" id="events"></ul>
        </section>

        <section class="dash-card">
          <div class="card-head">
            <h2 data-i18n="dash_docs_title">Dossier d'entreprise</h2>
            <a href="business-file.html" class="card-link" data-i18n="dash_docs_link">Tout voir →</a>
          </div>
          <ul class="documents" id="documents"></ul>
        </section>
      </aside>
    </div>
  </main>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/mock-data.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
