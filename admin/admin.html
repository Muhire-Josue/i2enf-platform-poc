<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue d'ensemble — I2ENF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/app.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="app-page">

  <header class="app-header" id="app-header"></header>

  <main class="container page">
    <section class="page-head">
      <div class="page-head-text">
        <span class="kicker" data-i18n="staff_kicker">Espace personnel</span>
        <h1 id="ad-hello"></h1>
        <p id="ad-intro"></p>
      </div>
    </section>

    <section class="ad-stats" id="ad-stats" aria-label="Résumé"></section>

    <div class="ad-grid">
      <div class="ad-main">
        <section class="dash-card">
          <div class="card-head">
            <h2 data-i18n="ad_todo_title">À traiter</h2>
            <span class="card-count" id="ad-todo-count"></span>
          </div>
          <ul class="ad-todo" id="ad-todo"></ul>
        </section>

        <section class="dash-card">
          <div class="card-head">
            <h2 data-i18n="ad_activity_title">Activité récente</h2>
            <span class="ad-live"><span class="ad-live-dot" aria-hidden="true"></span><span data-i18n="ad_live">En direct</span></span>
          </div>
          <ul class="ad-feed" id="ad-feed"></ul>
        </section>
      </div>

      <aside class="ad-side">
        <section class="dash-card">
          <div class="card-head">
            <h2 data-i18n="ad_week_title">Cette semaine</h2>
            <a href="scheduling.html" class="card-link" data-i18n="ad_week_link">Calendrier →</a>
          </div>
          <ul class="ad-week" id="ad-week"></ul>
        </section>

        <section class="dash-card">
          <div class="card-head">
            <h2 data-i18n="ad_cohort_title">La cohorte en bref</h2>
            <a href="kpi-dashboard.html" class="card-link" data-i18n="ad_cohort_link">Indicateurs →</a>
          </div>
          <ul class="ad-metrics" id="ad-metrics"></ul>
        </section>
      </aside>
    </div>
  </main>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/mock-data.js"></script>
  <script src="../shared/app.js"></script>
  <script src="../shared/staff.js"></script>
  <!-- <script src="admin.js"></script> -->
</body>
</html>
