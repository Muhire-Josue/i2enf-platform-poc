<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candidatures — I2ENF</title>
  <!-- Bootstrap (banners only) first, so the site's own styles take priority -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/app.css">
  <link rel="stylesheet" href="applications.css">
</head>
<body class="app-page">

  <header class="app-header" id="app-header"></header>

  <main class="container page">
    <section class="page-head">
      <div class="page-head-text">
        <span class="kicker" data-i18n="apps_kicker">Espace personnel</span>
        <h1 data-i18n="apps_title">Candidatures</h1>
        <p id="apps-intro"></p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn-outline" id="export-csv">
          <span data-i18n="apps_export">Exporter en CSV</span>
        </button>
      </div>
    </section>

    <div id="page-alerts" aria-live="polite"></div>

    <section class="apps-stats" id="apps-stats" aria-label="Résumé"></section>

    <section class="dash-card">
      <div class="apps-toolbar">
        <div class="apps-filters" id="apps-filters" role="tablist" aria-label="Statut"></div>
        <div class="apps-search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="apps-search" data-i18n-placeholder="apps_search" placeholder="Nom ou courriel" aria-label="Rechercher">
        </div>
      </div>
      <div class="apps-table-head" aria-hidden="true">
        <span data-i18n="apps_col_applicant">Candidat</span>
        <span data-i18n="apps_col_stage">Stade</span>
        <span data-i18n="apps_col_received">Reçue</span>
        <span data-i18n="apps_col_status">Statut</span>
        <span></span>
      </div>
      <ul class="apps-list" id="apps-list"></ul>
    </section>
  </main>

  <!-- Application review -->
  <dialog class="app-dialog review-dialog" id="review-dialog" aria-labelledby="review-name">
    <form method="dialog" id="review-form" novalidate>
      <button type="submit" value="close" class="review-close" data-i18n-aria-label="apps_close" aria-label="Fermer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="review-head" id="review-head"></div>
      <dl class="review-facts" id="review-facts"></dl>

      <div class="review-block">
        <h3 data-i18n="apps_project">Description du projet</h3>
        <p class="review-desc" id="review-desc"></p>
      </div>

      <div class="review-block">
        <h3 data-i18n="apps_criteria">Critères d'admissibilité</h3>
        <div class="review-criteria" id="review-criteria"></div>
      </div>

      <div class="form-field">
        <label for="review-note" data-i18n="apps_note">Note interne</label>
        <textarea id="review-note" rows="3" data-i18n-placeholder="apps_note_ph" placeholder="Visible seulement par l'équipe SOFIFRAN"></textarea>
      </div>

      <p class="review-error" id="review-error" role="alert" hidden></p>

      <div class="review-actions">
        <button type="button" class="btn-text danger" data-decision="declined" data-i18n="apps_decline">Refuser</button>
        <div class="review-actions-main">
          <button type="button" class="btn-outline" data-decision="review" data-i18n="apps_to_review">Mettre en évaluation</button>
          <button type="button" class="btn-primary" data-decision="accepted" data-i18n="apps_accept">Accepter la candidature</button>
        </div>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/mock-data.js"></script>
  <script src="../shared/alerts.js"></script>
  <script src="../shared/app.js"></script>
  <script src="../shared/staff.js"></script>
  <script src="applications.js"></script>
</body>
</html>
